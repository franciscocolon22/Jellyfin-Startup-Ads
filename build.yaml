framework: "net9.0"
owner: "franciscocolon22"
overview: "Anuncios al iniciar Jellyfin Web y pre-roll antes de cada vídeo."
description: >
  Dos sistemas de anuncios independientes: un overlay multimedia (imagen, vídeo o texto)
  al abrir Jellyfin Web, y un pre-roll que reproduce vídeos de la biblioteca antes de cada
  película o episodio (funciona también en apps nativas via IIntroProvider). Administrable
  desde el Dashboard, con countdown, omitir, programación, segmentación por usuario,
  prioridades, aleatorio y directorio externo.
category: "General"
artifacts:
  - "Jellyfin.Plugin.StartupAds.dll"
changelog: >-
  v1.4.3 — Con «Modo Cine» ya activado, "No ha sido posible encontrar un medio
  válido para reproducir" al darle a Play: casi siempre es que la biblioteca del
  pre-roll no está habilitada para ese usuario (Dashboard → Usuarios → Acceso a
  bibliotecas). El plugin ahora se protege solo: antes de entregar un pre-roll
  comprueba que el usuario puede verlo (Video.IsVisibleStandalone) y que tiene
  una fuente de medios reproducible; si no, lo omite y el contenido se reproduce
  con normalidad en vez de fallar. Incluye v1.4.2 (botón corregido + guía de
  Modo Cine), v1.4.1 y v1.4.0.
