framework: "net9.0"
owner: "franciscocolon22"
overview: "Anuncios al iniciar Jellyfin Web y pre-roll antes de cada vídeo."
description: >
  Dos sistemas de anuncios independientes: un overlay multimedia (imagen, vídeo o texto)
  al abrir Jellyfin Web, y un pre-roll que reproduce vídeos de la biblioteca antes de cada
  película o episodio (funciona también en apps nativas via IIntroProvider). Administrable
  desde el Dashboard, con countdown, omitir, programación, segmentación por usuario,
  prioridades, aleatorio y directorio externo.
category: "General"
artifacts:
  - "Jellyfin.Plugin.StartupAds.dll"
changelog: >-
  v1.4.4 — Nueva herramienta de diagnóstico en la sección de pre-roll: elige una
  película/episodio y un usuario, pulsa "Probar" y el servidor ejecuta la misma
  lógica exacta de una reproducción real, explicando ad por ad si se mostraría y
  por qué no (desactivado, fuera de horario, sin acceso a la biblioteca del
  vídeo, sin fuente de medios, frecuencia ya usada hoy...). Si dice que SÍ se
  reproduciría y aun así no suena nada, el problema es "Modo Cine" del cliente,
  no el plugin. Incluye v1.4.3 (protección por permisos de biblioteca), v1.4.2
  (botón corregido + guía de Modo Cine) y v1.4.1.
