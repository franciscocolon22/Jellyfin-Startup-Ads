changelog: >-
  v1.4.0 — NUEVO segundo sistema de anuncios independiente: «Anuncios antes de
  reproducir (pre-roll)». Vía IIntroProvider de Jellyfin reproduce vídeos de la
  biblioteca antes de cada película o episodio, en apps nativas incluidas. Sección
  de configuración y lista de anuncios propias, separadas de la presentación:
  a qué contenido aplica, máximo por reproducción, orden, aleatorio, frecuencia,
  programación por fechas/días/horas y segmentación por usuario. Incluye v1.3.4.
