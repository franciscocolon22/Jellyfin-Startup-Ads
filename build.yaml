framework: "net9.0"
owner: "franciscocolon22"
overview: "Anuncios al iniciar Jellyfin Web y pre-roll antes de cada vídeo."
description: >
  Dos sistemas de anuncios independientes: un overlay multimedia (imagen, vídeo o texto)
  al abrir Jellyfin Web, y un pre-roll que reproduce vídeos de la biblioteca antes de cada
  película o episodio (funciona también en apps nativas via IIntroProvider). Administrable
  desde el Dashboard, con countdown, omitir, programación, segmentación por usuario,
  prioridades, aleatorio y directorio externo.
category: "General"
artifacts:
  - "Jellyfin.Plugin.StartupAds.dll"
changelog: >-
  v1.4.2 — El botón «Crear anuncio»/«Añadir pre-roll» ya no ocupa todo el ancho (le
  sobraba la clase CSS "block"). Aviso automático en la sección de pre-roll que
  confirma si el servidor está bien configurado, y guía explícita del requisito
  «Modo Cine / Cinema Mode» por dispositivo: si está apagado en el cliente,
  Jellyfin nunca pide el pre-roll y va directo al contenido (no es un fallo del
  plugin). Incluye v1.4.1 (config en 3 bloques + carpeta de vídeos del pre-roll),
  v1.4.0 y v1.3.4.
