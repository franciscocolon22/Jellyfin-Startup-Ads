changelog: >-
  v1.4.6 — Corrige los acentos rotos ("configuraciÃ³n") que se veían en la
  descripción del plugin en Jellyfin (Complementos > Jellyfin Startup Ads) y en
  el historial de versiones tras instalar/actualizar desde cualquier release
  anterior. Causa: el script de empaquetado leía build/meta.json con
  Get-Content sin especificar UTF-8; en Windows PowerShell 5.1 eso usa la
  codepage ANSI del sistema para un archivo UTF-8 sin BOM y corrompe cada
  tilde/eñe al reempaquetarlo dentro del ZIP. Los archivos fuente en el
  repositorio siempre estuvieron en UTF-8 correcto; el problema solo afectaba
  al ZIP generado. Incluye v1.4.5 ("Validar carpeta" explica qué falta), v1.4.4
  (diagnóstico) y v1.4.3.
